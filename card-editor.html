<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holo-Lab 4.1: Final Polish</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --panel-bg: rgba(30, 41, 59, 0.95);
        --text-color: #e2e8f0;

        /* Valores por defecto */
        --card-frame-padding: 8px;
        --card-img-radius: 4px;
        --layer-zoom: 1.1;

        /* Capas */
        --layer-base-contrast: 1;

        --layer-nature-opacity: 1;
        --layer-nature-blend: normal;

        --layer-passion-opacity: 0.6;
        --layer-passion-blend: soft-light;

        --layer-ink-opacity: 0.9;
        --layer-ink-blend: multiply;

        /* Capa Gold */
        --layer-gold-opacity: 0.1;
        --layer-gold-blend: screen;
        --layer-gold-brightness: 2.8;
        --layer-gold-pattern: none;
        --gold-mask-url: url("./public/cards_layered/ar13/gold.png");

        --layer-spirit-opacity: 0.4;
        --layer-spirit-blend: screen;

        --tilt-x: 0deg;
        --tilt-y: 0deg;
      }

      body {
        margin: 0;
        background: var(--bg-color);
        color: var(--text-color);
        font-family: system-ui, sans-serif;
        overflow: hidden;
        display: flex;
        height: 100vh;
      }

      .preview-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1200px;
        background: radial-gradient(circle at center, #334155 0%, #0f172a 100%);
      }

      .card-container {
        width: 320px;
        height: 560px;
        position: relative;
        transform-style: preserve-3d;
        transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
        transition: transform 0.1s;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      }

      .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: #fdfbf7;
        padding: var(--card-frame-padding);
        box-sizing: border-box;
        border-radius: 12px;
        overflow: hidden;
      }

      .card-layers {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: var(--card-img-radius);
        border: 1px solid rgba(0, 0, 0, 0.1);
        background: #fff;
        isolation: isolate;
      }

      .layer-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%) scale(var(--layer-zoom));
        pointer-events: none;
      }

      .layer-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* ESTILOS DE CAPAS */
      .layer-base {
        z-index: 1;
        filter: contrast(var(--layer-base-contrast));
      }
      .layer-nature {
        z-index: 2;
        mix-blend-mode: var(--layer-nature-blend);
        opacity: var(--layer-nature-opacity);
      }
      .layer-passion {
        z-index: 3;
        mix-blend-mode: var(--layer-passion-blend);
        opacity: var(--layer-passion-opacity);
      }
      .layer-ink {
        z-index: 4;
        mix-blend-mode: var(--layer-ink-blend);
        opacity: var(--layer-ink-opacity);
      }

      /* FIX MÁSCARA: Wrapper Gold */
      .wrapper-gold {
        z-index: 5;
        mix-blend-mode: var(--layer-gold-blend);
        filter: brightness(var(--layer-gold-brightness));
      }

      .wrapper-gold .layer-img {
        opacity: var(--layer-gold-opacity);
      }

      .wrapper-gold::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--layer-gold-pattern);
        -webkit-mask-image: var(--gold-mask-url);
        mask-image: var(--gold-mask-url);
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        mix-blend-mode: overlay;
        opacity: 0.8;
        pointer-events: none;
        z-index: 10;
      }

      .layer-spirit {
        z-index: 6;
        mix-blend-mode: var(--layer-spirit-blend);
        opacity: var(--layer-spirit-opacity);
      }

      /* CONTROLES */
      .controls {
        width: 360px;
        background: var(--panel-bg);
        padding: 20px;
        border-left: 1px solid rgba(255, 255, 255, 0.1);
        overflow-y: auto;
      }
      .control-group {
        margin-bottom: 12px;
      }

      label {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        margin-bottom: 4px;
        color: #94a3b8;
      }

      input[type="range"] {
        height: 4px;
        border-radius: 2px;
        -webkit-appearance: none;
        appearance: none; /* Standard property added */
        background: #334155;
        width: 100%;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: #60a5fa;
        border-radius: 50%;
        cursor: pointer;
      }

      select {
        background: #1e293b;
        color: #e2e8f0;
        border: 1px solid #475569;
        padding: 4px;
        font-size: 0.8rem;
        border-radius: 4px;
        width: 100%;
      }

      .value-display {
        color: #60a5fa;
        font-family: monospace;
        font-size: 0.8rem;
      }
      .css-output {
        width: 100%;
        height: 100px;
        background: #000;
        color: #0f0;
        border: none;
        padding: 10px;
        font-size: 0.7rem;
        margin-top: 20px;
        font-family: monospace;
      }
      .help-text {
        color: #64748b;
        font-size: 0.7rem;
        display: block;
        margin-top: 5px;
      }

      h2 {
        color: #fff;
        border-bottom: 1px solid #475569;
        padding-bottom: 10px;
        font-size: 1.2rem;
      }
      h3 {
        color: #60a5fa;
        font-size: 0.8rem;
        text-transform: uppercase;
        margin-top: 15px;
        margin-bottom: 8px;
        border-bottom: 1px solid #334155;
        padding-bottom: 2px;
      }

      /* Utility Classes for Layer Sections */
      .layer-section {
        border-left: 2px solid #334155;
        padding-left: 10px;
        margin-bottom: 15px;
      }
      .border-gold {
        border-left-color: #fbbf24;
      }
      .border-passion {
        border-left-color: #f87171;
      }
      .border-ink {
        border-left-color: #1e293b;
      }
      .border-spirit {
        border-left-color: #c084fc;
      }
      .border-nature {
        border-left-color: #4ade80;
      }

      .text-gold {
        color: #fbbf24;
        font-weight: bold;
      }
      .text-passion {
        color: #f87171;
        font-weight: bold;
      }
      .text-ink {
        color: #94a3b8;
        font-weight: bold;
      }
      .text-spirit {
        color: #c084fc;
        font-weight: bold;
      }
      .text-nature {
        color: #4ade80;
        font-weight: bold;
      }

      .flex-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .check-label {
        margin: 0;
      }
      .check-input {
        width: auto;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
  </head>
  <body>
    <div class="preview-area" id="previewArea">
      <div class="card-container">
        <div class="card-face">
          <div class="card-layers">
            <div class="layer-wrapper layer-base">
              <img
                src="./public/cards_layered/ar13/base.png"
                class="layer-img"
                alt="Base"
              />
            </div>
            <div class="layer-wrapper layer-nature">
              <img
                src="./public/cards_layered/ar13/nature.png"
                class="layer-img"
                alt="Nature"
              />
            </div>
            <div class="layer-wrapper layer-passion">
              <img
                src="./public/cards_layered/ar13/passion.png"
                class="layer-img"
                alt="Passion"
              />
            </div>
            <div class="layer-wrapper layer-ink">
              <img
                src="./public/cards_layered/ar13/ink.png"
                class="layer-img"
                alt="Ink"
              />
            </div>
            <div class="layer-wrapper wrapper-gold">
              <img
                src="./public/cards_layered/ar13/gold.png"
                class="layer-img"
                alt="Gold"
              />
            </div>
            <div class="layer-wrapper layer-spirit">
              <img
                src="./public/cards_layered/ar13/spirit.png"
                class="layer-img"
                alt="Spirit"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <h2>🎛️ Holo-Lab 4.1</h2>

      <h3>Geometría</h3>
      <div class="control-group">
        <label for="inp-padding"
          >Padding <span id="v-pad" class="value-display">8px</span></label
        >
        <input
          id="inp-padding"
          type="range"
          min="0"
          max="30"
          value="8"
          oninput="upd('--card-frame-padding', this.value+'px', 'v-pad')"
        />
      </div>
      <div class="control-group">
        <label for="inp-radius"
          >Radio <span id="v-rad" class="value-display">4px</span></label
        >
        <input
          id="inp-radius"
          type="range"
          min="0"
          max="20"
          value="4"
          oninput="upd('--card-img-radius', this.value+'px', 'v-rad')"
        />
      </div>

      <h3>Capas (Layers)</h3>

      <!-- GOLD -->
      <div class="layer-section border-gold">
        <label class="text-gold">GOLD LAYER (Holo)</label>
        <div class="control-group">
          <label for="inp-gold-op"
            >Opacidad <span id="v-g-op" class="value-display">0.1</span></label
          >
          <input
            id="inp-gold-op"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.1"
            oninput="upd('--layer-gold-opacity', this.value, 'v-g-op')"
          />
        </div>
        <div class="control-group">
          <label for="inp-gold-br"
            >Brillo <span id="v-g-br" class="value-display">2.8</span></label
          >
          <input
            id="inp-gold-br"
            type="range"
            min="0.5"
            max="5"
            step="0.1"
            value="2.8"
            oninput="upd('--layer-gold-brightness', this.value, 'v-g-br')"
          />
        </div>
        <div class="control-group">
          <label for="sel-blend">Blend</label>
          <select
            id="sel-blend"
            onchange="upd('--layer-gold-blend', this.value)"
          >
            <option value="screen" selected>Screen</option>
            <option value="color-dodge">Color Dodge</option>
            <option value="overlay">Overlay</option>
            <option value="normal">Normal</option>
          </select>
        </div>
        <div class="control-group">
          <label for="sel-pattern">Patrón Holo</label>
          <select
            id="sel-pattern"
            onchange="upd('--layer-gold-pattern', this.value)"
          >
            <option value="none" selected>Ninguno</option>
            <option
              value="linear-gradient(135deg, transparent 40%, white 50%, transparent 60%)"
            >
              Rayo Diagonal
            </option>
            <option
              value="repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.5) 5px, rgba(255,255,255,0.5) 10px)"
            >
              Rayas Holográficas
            </option>
            <option
              value="radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%)"
            >
              Destello Central
            </option>
          </select>
        </div>
      </div>

      <!-- PASSION -->
      <div class="layer-section border-passion">
        <label class="text-passion">PASSION LAYER</label>
        <div class="control-group">
          <label for="inp-pass-op"
            >Opacidad <span id="v-pass" class="value-display">0.6</span></label
          >
          <input
            id="inp-pass-op"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.6"
            oninput="upd('--layer-passion-opacity', this.value, 'v-pass')"
          />
        </div>
        <div class="control-group">
          <label for="sel-pass-blend">Blend</label>
          <select
            id="sel-pass-blend"
            onchange="upd('--layer-passion-blend', this.value)"
          >
            <option value="soft-light" selected>Soft Light</option>
            <option value="multiply">Multiply</option>
            <option value="overlay">Overlay</option>
            <option value="normal">Normal</option>
          </select>
        </div>
      </div>

      <!-- INK -->
      <div class="layer-section border-ink">
        <label class="text-ink">INK LAYER</label>
        <div class="control-group">
          <label for="inp-ink-op"
            >Opacidad <span id="v-ink" class="value-display">0.9</span></label
          >
          <input
            id="inp-ink-op"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.9"
            oninput="upd('--layer-ink-opacity', this.value, 'v-ink')"
          />
        </div>
        <div class="control-group">
          <label for="sel-ink-blend">Blend</label>
          <select
            id="sel-ink-blend"
            onchange="upd('--layer-ink-blend', this.value)"
          >
            <option value="multiply" selected>Multiply</option>
            <option value="normal">Normal</option>
            <option value="darken">Darken</option>
          </select>
        </div>
      </div>

      <!-- SPIRIT -->
      <div class="layer-section border-spirit">
        <label class="text-spirit">SPIRIT LAYER</label>
        <div class="control-group">
          <label for="inp-spi-op"
            >Opacidad <span id="v-spi" class="value-display">0.4</span></label
          >
          <input
            id="inp-spi-op"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.4"
            oninput="upd('--layer-spirit-opacity', this.value, 'v-spi')"
          />
        </div>
        <div class="control-group">
          <label for="sel-spi-blend">Blend</label>
          <select
            id="sel-spi-blend"
            onchange="upd('--layer-spirit-blend', this.value)"
          >
            <option value="screen" selected>Screen</option>
            <option value="lighten">Lighten</option>
            <option value="normal">Normal</option>
          </select>
        </div>
      </div>

      <!-- NATURE -->
      <div class="layer-section border-nature">
        <label class="text-nature">NATURE LAYER</label>
        <div class="control-group">
          <label for="inp-nat-op"
            >Opacidad <span id="v-nat" class="value-display">1.0</span></label
          >
          <input
            id="inp-nat-op"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="1.0"
            oninput="upd('--layer-nature-opacity', this.value, 'v-nat')"
          />
        </div>
      </div>

      <h3>Debug Mode</h3>
      <div class="control-group">
        <div class="flex-between">
          <label for="chk-debug" class="check-label"
            >Mostrar Máscara Roja</label
          >
          <input
            id="chk-debug"
            class="check-input"
            type="checkbox"
            onchange="toggleDebug(this.checked)"
          />
        </div>
        <span class="help-text"
          >Si ves todo rojo y no solo el oro, la máscara falla.</span
        >
      </div>

      <h3>Salida CSS</h3>
      <label for="cssOut" class="sr-only">CSS Output</label>
      <textarea id="cssOut" class="css-output"></textarea>
    </div>

    <script>
      const root = document.documentElement;
      const preview = document.getElementById("previewArea");
      const out = document.getElementById("cssOut");

      // Parallax simple
      preview.addEventListener("mousemove", (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 2;
        const y = (e.clientY / window.innerHeight - 0.5) * 2;
        root.style.setProperty("--tilt-y", x * 15 + "deg");
        root.style.setProperty("--tilt-x", y * -15 + "deg");
      });

      function upd(name, val, displayId) {
        root.style.setProperty(name, val);
        if (displayId) document.getElementById(displayId).textContent = val;
        genCSS();
      }

      function toggleDebug(enabled) {
        if (enabled) {
          // DEBUG: Rojo intenso
          root.style.setProperty(
            "--layer-gold-pattern",
            "repeating-linear-gradient(45deg, red, red 10px, yellow 10px, yellow 20px)"
          );
          root.style.setProperty("--layer-gold-blend", "normal");
          root.style.setProperty("--layer-gold-opacity", "1");

          const style = document.createElement("style");
          style.id = "debug-css";
          style.textContent = `
                    .wrapper-gold::after {
                       opacity: 1 !important;
                       mix-blend-mode: normal !important;
                    }
                    .wrapper-gold .layer-img {
                        opacity: 0.2 !important; 
                        filter: grayscale(1);
                    }
                `;
          document.head.appendChild(style);
        } else {
          const style = document.getElementById("debug-css");
          if (style) style.remove();

          // Restaurar
          upd("--layer-gold-blend", document.getElementById("sel-blend").value);
          upd(
            "--layer-gold-pattern",
            document.getElementById("sel-pattern").value
          );
          upd(
            "--layer-gold-opacity",
            document.getElementById("inp-gold-op").value
          );
        }
      }

      function genCSS() {
        const s = getComputedStyle(root);
        out.value = `
/* Configuración Holo-Lab 4.1 */
:root {
  --card-frame-padding: ${s.getPropertyValue("--card-frame-padding").trim()};
  --card-img-radius: ${s.getPropertyValue("--card-img-radius").trim()};

  /* Capas */
  --layer-base-contrast: ${s.getPropertyValue("--layer-base-contrast").trim()};
  
  --layer-nature-opacity: ${s
    .getPropertyValue("--layer-nature-opacity")
    .trim()};
  --layer-nature-blend: ${s.getPropertyValue("--layer-nature-blend").trim()};

  --layer-passion-opacity: ${s
    .getPropertyValue("--layer-passion-opacity")
    .trim()};
  --layer-passion-blend: ${s.getPropertyValue("--layer-passion-blend").trim()};

  --layer-ink-opacity: ${s.getPropertyValue("--layer-ink-opacity").trim()};
  --layer-ink-blend: ${s.getPropertyValue("--layer-ink-blend").trim()};

  --layer-gold-opacity: ${s.getPropertyValue("--layer-gold-opacity").trim()};
  --layer-gold-blend: ${s.getPropertyValue("--layer-gold-blend").trim()};
  --layer-gold-brightness: ${s
    .getPropertyValue("--layer-gold-brightness")
    .trim()};

  --layer-spirit-opacity: ${s
    .getPropertyValue("--layer-spirit-opacity")
    .trim()};
  --layer-spirit-blend: ${s.getPropertyValue("--layer-spirit-blend").trim()};
}`.trim();
      }
      genCSS();
    </script>
  </body>
</html>
