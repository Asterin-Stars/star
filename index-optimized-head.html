<!DOCTYPE html>
<html lang="es" id="htmlRoot">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star ✦</title>
    <meta name="description" content="Oráculo de Tarot y Numerología del presente.">

    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://maps.googleapis.com">

    <!-- Critical CSS for preloader (inline for instant render) -->
    <style>
        /* PRELOADER - Critical CSS loaded first */
        #starPreloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #starPreloader.loaded {
            opacity: 0;
            visibility: hidden;
        }

        .preloader-logo {
            font-size: 4rem;
            font-weight: 700;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: pulse 2s ease-in-out infinite;
            font-family: 'Poppins', sans-serif;
        }

        .preloader-spinner {
            margin-top: 2rem;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .preloader-text {
            margin-top: 1.5rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            font-family: 'Poppins', sans-serif;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Hide main content until loaded */
        body.loading #app-container {
            opacity: 0;
            visibility: hidden;
        }
    </style>

    <!-- Load fonts async (non-blocking) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    </noscript>

    <!-- Defer non-critical scripts -->
    <script src="./public/libs/minikit-wrapper.js" defer></script>
    <script src="./public/i18n.js" defer></script>
