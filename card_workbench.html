<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card VFX Lab - Effects Testing</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        background: #0a0a0a;
        color: #ccc;
        font-family: "Segoe UI", system-ui, sans-serif;
        height: 100vh;
        overflow: hidden;
      }

      .canvas {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1a1a1a, #000);
      }

      .controls {
        width: 380px;
        background: #1a1a1a;
        border-left: 2px solid #333;
        padding: 20px;
        overflow-y: auto;
      }

      /* === CARTA - DISEÑO ORIGINAL === */
      .card-stage {
        width: 300px;
        aspect-ratio: 9/16;
        perspective: 1800px;
        cursor: pointer;
        transform-style: preserve-3d;
      }

      .card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        border-radius: 26px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      /* DORSO - Gradiente Púrpura/Índigo ORIGINAL */
      .front {
        background-image: radial-gradient(
            circle at 30% 30%,
            rgba(147, 51, 234, 0.15) 0%,
            transparent 50%
          ),
          linear-gradient(
            to bottom right,
            rgba(147, 51, 234, 0.25),
            rgba(79, 70, 229, 0.25)
          );
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }

      .symbol {
        width: 70px;
        height: 70px;
        border: 1.5px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: rgba(255, 255, 255, 0.8);
        font-weight: 300;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }

      /* ANVERSO - Revelación */
      .back {
        background: transparent;
        backdrop-filter: blur(10px);
        transform: rotateY(180deg);
        border: 1px solid rgba(255, 255, 255, 0.2);
        overflow: hidden;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .tarot-img {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
        position: relative;
        z-index: 1;
      }

      /* === EFFECT LAYERS - SOLO SOBRE LA ILUSTRACIÓN === */

      .fx-texture {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        mix-blend-mode: overlay;
        background-size: 300px 300px;
        background-repeat: repeat;
      }

      .fx-holo {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        opacity: 0;
        background-size: 200% 200%;
      }

      .fx-glare {
        position: absolute;
        inset: -50%;
        width: 200%;
        height: 200%;
        z-index: 4;
        pointer-events: none;
        opacity: 0;
        mix-blend-mode: soft-light;
      }

      /* === TEXTURE VARIANTS (STATIC) === */
      .tex-paper {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n1'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' seed='1' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n1)'/%3E%3C/svg%3E");
      }

      .tex-linen {
        background-image: repeating-linear-gradient(
            0deg,
            transparent,
            transparent 1px,
            rgba(0, 0, 0, 0.03) 2px
          ),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 1px,
            rgba(0, 0, 0, 0.03) 2px
          );
        background-size: 4px 4px;
      }

      .tex-leather {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n2'%3E%3CfeTurbulence type='turbulence' baseFrequency='0.8' seed='2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n2)'/%3E%3C/svg%3E");
      }

      .tex-metal {
        background: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.1) 0%,
          transparent 10%,
          rgba(255, 255, 255, 0.05) 20%,
          transparent 30%,
          rgba(0, 0, 0, 0.1) 40%,
          transparent 50%,
          rgba(255, 255, 255, 0.05) 60%,
          transparent 70%,
          rgba(0, 0, 0, 0.1) 80%,
          transparent 90%
        );
      }

      .tex-canvas {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n3'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='4' seed='3' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n3)'/%3E%3C/svg%3E");
        background-size: 150px 150px;
      }

      .tex-dots {
        background-image: radial-gradient(
          circle at center,
          rgba(0, 0, 0, 0.4) 1px,
          transparent 1px
        );
        background-size: 8px 8px;
      }

      /* === HOLO VARIANTS === */
      .holo-rainbow {
        background: linear-gradient(
          115deg,
          transparent 0%,
          rgba(255, 0, 0, 0.3) 20%,
          rgba(255, 255, 0, 0.3) 35%,
          rgba(0, 255, 0, 0.3) 50%,
          rgba(0, 255, 255, 0.3) 65%,
          rgba(0, 0, 255, 0.3) 80%,
          transparent 100%
        );
        mix-blend-mode: color-dodge;
      }

      .holo-sparkle {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='sp'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' seed='5'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23sp)'/%3E%3C/svg%3E"),
          linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.1),
            rgba(255, 255, 255, 0.3),
            rgba(255, 255, 255, 0.1)
          );
        mix-blend-mode: screen;
        filter: contrast(200%) brightness(150%);
      }

      .holo-oil {
        background: radial-gradient(
          ellipse at center,
          rgba(255, 0, 255, 0.3) 0%,
          rgba(0, 255, 255, 0.3) 25%,
          rgba(255, 255, 0, 0.3) 50%,
          rgba(255, 0, 255, 0.3) 75%,
          transparent 100%
        );
        mix-blend-mode: hard-light;
        background-size: 120% 120%;
      }

      .holo-cosmos {
        background-image: radial-gradient(
            circle at 20% 30%,
            rgba(147, 51, 234, 0.4) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 70% 60%,
            rgba(59, 130, 246, 0.4) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 40% 80%,
            rgba(236, 72, 153, 0.4) 0%,
            transparent 50%
          );
        mix-blend-mode: screen;
      }

      .holo-stripes {
        background: repeating-linear-gradient(
          45deg,
          transparent 0px,
          rgba(255, 255, 255, 0.1) 5px,
          transparent 10px,
          rgba(0, 255, 255, 0.2) 15px,
          transparent 20px,
          rgba(255, 0, 255, 0.2) 25px,
          transparent 30px
        );
        mix-blend-mode: overlay;
      }

      .holo-circles {
        background-image: radial-gradient(
            circle at center,
            transparent 30%,
            rgba(255, 255, 255, 0.1) 31%,
            transparent 32%
          ),
          radial-gradient(
            circle at center,
            transparent 50%,
            rgba(0, 255, 255, 0.2) 51%,
            transparent 52%
          ),
          radial-gradient(
            circle at center,
            transparent 70%,
            rgba(255, 0, 255, 0.2) 71%,
            transparent 72%
          );
        background-size: 100px 100px;
        mix-blend-mode: screen;
      }

      .holo-prism {
        background: linear-gradient(
          to right,
          rgba(255, 0, 0, 0.2) 0%,
          rgba(255, 255, 0, 0.2) 16.6%,
          rgba(0, 255, 0, 0.2) 33.3%,
          rgba(0, 255, 255, 0.2) 50%,
          rgba(0, 0, 255, 0.2) 66.6%,
          rgba(255, 0, 255, 0.2) 83.3%,
          rgba(255, 0, 0, 0.2) 100%
        );
        mix-blend-mode: color-dodge;
      }

      /* === GLARE VARIANTS === */
      .glare-soft {
        background: radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.9) 0%,
          rgba(255, 255, 255, 0.4) 20%,
          transparent 60%
        );
      }

      .glare-beam {
        background: linear-gradient(
          to right,
          transparent 46%,
          rgba(255, 255, 255, 0.95) 50%,
          transparent 54%
        );
        transform: rotate(35deg);
      }

      .glare-cross {
        background: linear-gradient(
            to right,
            transparent 48%,
            rgba(255, 255, 255, 0.8) 50%,
            transparent 52%
          ),
          linear-gradient(
            to bottom,
            transparent 48%,
            rgba(255, 255, 255, 0.8) 50%,
            transparent 52%
          );
      }

      .glare-star {
        background: radial-gradient(
            ellipse at center,
            rgba(255, 255, 255, 0.9) 0%,
            transparent 40%
          ),
          linear-gradient(
            45deg,
            transparent 48%,
            rgba(255, 255, 255, 0.6) 50%,
            transparent 52%
          ),
          linear-gradient(
            -45deg,
            transparent 48%,
            rgba(255, 255, 255, 0.6) 50%,
            transparent 52%
          );
      }

      .glare-ripple {
        background-image: radial-gradient(
            circle at center,
            transparent 10%,
            rgba(255, 255, 255, 0.3) 12%,
            transparent 14%
          ),
          radial-gradient(
            circle at center,
            transparent 25%,
            rgba(255, 255, 255, 0.2) 27%,
            transparent 29%
          ),
          radial-gradient(
            circle at center,
            transparent 40%,
            rgba(255, 255, 255, 0.1) 42%,
            transparent 44%
          );
      }

      /* === UI === */
      h2 {
        color: #fff;
        font-size: 1rem;
        border-bottom: 2px solid #333;
        padding-bottom: 8px;
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .section {
        background: #222;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 12px;
        border: 1px solid #333;
      }

      .section h3 {
        color: #10b981;
        font-size: 0.85rem;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-size: 0.8rem;
      }

      label {
        color: #9ca3af;
        font-weight: 500;
      }

      select,
      input[type="range"] {
        background: #333;
        border: 1px solid #444;
        color: #eee;
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 0.75rem;
      }

      input[type="range"] {
        width: 140px;
        accent-color: #10b981;
      }

      select {
        width: 160px;
      }

      button {
        background: #0891b2;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 4px;
        width: 100%;
        cursor: pointer;
        font-weight: 600;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 0.8rem;
      }

      button:hover {
        background: #06b6d4;
      }
      button.secondary {
        background: #334155;
      }
      button.secondary:hover {
        background: #475569;
      }

      .value-display {
        color: #10b981;
        font-family: monospace;
        font-size: 0.75rem;
        min-width: 35px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="card-stage" id="stage">
        <div class="card-inner" id="inner">
          <div class="card-face front">
            <div class="symbol">☾</div>
          </div>
          <div class="card-face back">
            <img src="./public/cards/ar16.jpg" id="cardImg" class="tarot-img" />

            <!-- SOLO EFECTOS SOBRE LA ILUSTRACIÓN -->
            <div id="fxTexture" class="fx-texture"></div>
            <div id="fxHolo" class="fx-holo"></div>
            <div id="fxGlare" class="fx-glare"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <h2>🎨 VFX Testing Lab</h2>

      <div class="section">
        <h3>Card Actions</h3>
        <button onclick="flip()">⟲ Voltear Carta</button>
        <button class="secondary" onclick="nextCard()">→ Cambiar Arte</button>
      </div>

      <div class="section">
        <h3>1. Relief / Texture</h3>
        <div class="row">
          <label>Type</label>
          <select id="texType" onchange="update()">
            <option value="">❌ Off</option>
            <option value="tex-paper">Paper Grain</option>
            <option value="tex-linen">Linen</option>
            <option value="tex-leather">Leather</option>
            <option value="tex-metal">Brushed Metal</option>
            <option value="tex-canvas">Canvas</option>
            <option value="tex-dots">Dot Matrix</option>
          </select>
        </div>
        <div class="row">
          <label>Opacity</label>
          <input
            type="range"
            id="texOp"
            min="0"
            max="1"
            step="0.05"
            value="0.4"
            oninput="update()"
          />
          <span class="value-display" id="texOpVal">0.4</span>
        </div>
        <div class="row">
          <label>Blend</label>
          <select id="texBlend" onchange="update()">
            <option value="overlay">Overlay</option>
            <option value="multiply">Multiply</option>
            <option value="soft-light">Soft Light</option>
            <option value="hard-light">Hard Light</option>
          </select>
        </div>
        <div class="row">
          <label>⚡ Light Response</label>
          <input
            type="range"
            id="texLight"
            min="0"
            max="1"
            step="0.1"
            value="0.5"
            oninput="update()"
          />
          <span class="value-display" id="texLightVal">0.5</span>
        </div>
      </div>

      <div class="section">
        <h3>2. Holographic</h3>
        <div class="row">
          <label>Type</label>
          <select id="holoType" onchange="update()">
            <option value="">❌ Off</option>
            <option value="holo-rainbow">Rainbow</option>
            <option value="holo-sparkle">Sparkle/Foil</option>
            <option value="holo-oil">Oil Slick</option>
            <option value="holo-cosmos">Cosmos</option>
            <option value="holo-stripes">Stripes</option>
            <option value="holo-circles">Circles</option>
            <option value="holo-prism">Prism</option>
          </select>
        </div>
        <div class="row">
          <label>Opacity</label>
          <input
            type="range"
            id="holoOp"
            min="0"
            max="1"
            step="0.05"
            value="0.5"
            oninput="update()"
          />
          <span class="value-display" id="holoOpVal">0.5</span>
        </div>
        <div class="row">
          <label>Blend</label>
          <select id="holoBlend" onchange="update()">
            <option value="color-dodge">Color Dodge</option>
            <option value="screen">Screen</option>
            <option value="overlay">Overlay</option>
            <option value="hard-light">Hard Light</option>
          </select>
        </div>
      </div>

      <div class="section">
        <h3>3. Light Glare</h3>
        <div class="row">
          <label>Type</label>
          <select id="glareType" onchange="update()">
            <option value="">❌ Off</option>
            <option value="glare-soft">Soft Radial</option>
            <option value="glare-beam">Sharp Beam</option>
            <option value="glare-cross">Cross</option>
            <option value="glare-star">Star</option>
            <option value="glare-ripple">Ripple</option>
          </select>
        </div>
        <div class="row">
          <label>Opacity</label>
          <input
            type="range"
            id="glareOp"
            min="0"
            max="1"
            step="0.05"
            value="0.6"
            oninput="update()"
          />
          <span class="value-display" id="glareOpVal">0.6</span>
        </div>
        <div class="row">
          <label>Blend</label>
          <select id="glareBlend" onchange="update()">
            <option value="soft-light">Soft Light</option>
            <option value="overlay">Overlay</option>
            <option value="screen">Screen</option>
          </select>
        </div>
      </div>
    </div>

    <script>
      const stage = document.getElementById("stage");
      const inner = document.getElementById("inner");
      const fxTexture = document.getElementById("fxTexture");
      const fxHolo = document.getElementById("fxHolo");
      const fxGlare = document.getElementById("fxGlare");

      let flipped = false;
      let mouseX = 0.5,
        mouseY = 0.5;

      function flip() {
        flipped = !flipped;
        updateTransform();
      }

      const cards = ["ar16", "ar00", "ar01", "ar13", "ar21", "ar03", "ar12"];
      let cardIdx = 0;
      function nextCard() {
        cardIdx = (cardIdx + 1) % cards.length;
        document.getElementById(
          "cardImg"
        ).src = `./public/cards/${cards[cardIdx]}.jpg`;
      }

      function update() {
        // TEXTURE
        const texType = document.getElementById("texType").value;
        const texOp = parseFloat(document.getElementById("texOp").value);
        const texBlend = document.getElementById("texBlend").value;
        const texLight = parseFloat(document.getElementById("texLight").value);

        document.getElementById("texOpVal").textContent = texOp.toFixed(2);
        document.getElementById("texLightVal").textContent =
          texLight.toFixed(1);

        fxTexture.className = "fx-texture " + texType;
        fxTexture.style.mixBlendMode = texBlend;

        const baseOpacity = texOp * (1 - texLight);
        const dynamicOpacity = texOp * texLight * getGlareIntensity();
        fxTexture.style.opacity = texType ? baseOpacity + dynamicOpacity : 0;

        // HOLO
        const holoType = document.getElementById("holoType").value;
        const holoOp = parseFloat(document.getElementById("holoOp").value);
        const holoBlend = document.getElementById("holoBlend").value;

        document.getElementById("holoOpVal").textContent = holoOp.toFixed(2);

        fxHolo.className = "fx-holo " + holoType;
        fxHolo.style.opacity = holoType ? holoOp : 0;
        fxHolo.style.mixBlendMode = holoBlend;

        // GLARE
        const glareType = document.getElementById("glareType").value;
        const glareOp = parseFloat(document.getElementById("glareOp").value);
        const glareBlend = document.getElementById("glareBlend").value;

        document.getElementById("glareOpVal").textContent = glareOp.toFixed(2);

        fxGlare.className = "fx-glare " + glareType;
        fxGlare.style.opacity = glareType ? glareOp : 0;
        fxGlare.style.mixBlendMode = glareBlend;

        updateGlarePosition();
      }

      function getGlareIntensity() {
        const dx = mouseX - 0.5;
        const dy = mouseY - 0.5;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 0.7;
        return Math.max(0, 1 - dist / maxDist);
      }

      function updateGlarePosition() {
        const offsetX = (mouseX - 0.5) * 100;
        const offsetY = (mouseY - 0.5) * 100;
        fxGlare.style.transform = `translate(${offsetX}%, ${offsetY}%)`;
      }

      function updateTransform() {
        const rect = stage.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const dx = (lastMouseX - centerX) / (rect.width / 2);
        const dy = (lastMouseY - centerY) / (rect.height / 2);

        const tiltX = dy * -12;
        const tiltY = dx * 12;
        const baseRot = flipped ? 180 : 0;

        inner.style.transform = `rotateX(${tiltX}deg) rotateY(${
          baseRot + tiltY
        }deg)`;
      }

      let lastMouseX = window.innerWidth / 2;
      let lastMouseY = window.innerHeight / 2;

      document.addEventListener("mousemove", (e) => {
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;

        const rect = stage.getBoundingClientRect();
        mouseX = (e.clientX - rect.left) / rect.width;
        mouseY = (e.clientY - rect.top) / rect.height;

        updateTransform();
        update();
      });

      stage.addEventListener("click", flip);

      update();
    </script>
  </body>
</html>
